# Font Settings
font_family JetBrains Mono Regular
bold_font JetBrains Mono Bold
italic_font JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size 12.0

# Window Settings
window_padding_width 6
background_opacity 1.0

# Keyboard Bindings (Alacritty's Control|Alt is equivalent to Kitty's Ctrl+Alt)
# Kitty uses clipboard for copy/paste actions by default, which is the most common behavior.
# Alacritty's Copy/Paste actions are typically equivalent to the OS clipboard operations.
# The default kitty bindings are usually Ctrl+Shift+C/V.
# If you want to replicate the *exact* custom Alacritty bindings:
map ctrl+alt+v paste_from_clipboard
map ctrl+alt+c copy_to_clipboard

font_features none
macos_font_smoothing standard
text_composition_strategy legacy
disable_ligatures_in active always
